# ---- appended by the TITAN spike entrypoint ----
listen_addresses = '*'
shared_buffers = 128MB
maintenance_work_mem = 256MB
work_mem = 16MB

# Logical replication, as required by Spock (docs/install_spock.md)
wal_level = logical
max_worker_processes = 16
max_replication_slots = 10
max_wal_senders = 10
track_commit_timestamp = on
shared_preload_libraries = 'spock'
# PostgreSQL 15.19/16.15/17.11/18.6+ only allow allow-listed logical decoding
# output plugins; Spock decodes with spock_output (spock main README).
output_plugin_libraries = 'pgoutput, test_decoding, spock_output'

# Spock automatic DDL replication (docs/managing/spock_autoddl.md)
spock.enable_ddl_replication = on
spock.include_ddl_repset = on
spock.allow_ddl_from_functions = on

# Conflict handling (docs/conflicts.md). last_update_wins is the only value
# compiled in for 5.0.x (others are commented out in src/spock.c).
spock.conflict_resolution = last_update_wins
spock.save_resolutions = on
spock.conflict_log_level = LOG

log_min_messages = warning
log_line_prefix = '%m [%p] %q%a '
