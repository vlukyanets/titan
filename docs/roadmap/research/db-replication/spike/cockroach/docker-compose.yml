# CockroachDB spike: three insecure nodes.
# Node-to-node (RPC/Raft) traffic uses the `cluster` network only: every node
# advertises `nX-cluster:26357`, an alias that exists only on `cluster`.
# SQL for the harness uses port 26257 via the `client` network (host ports 16201-16203).
# DB Console (HTTP) on host ports 16204-16206.
name: spike-cockroach

x-node: &node
  image: cockroachdb/cockroach:v26.3.2
  restart: "no"

services:
  node1:
    <<: *node
    hostname: node1
    command: >
      start --insecure
      --listen-addr=:26357 --advertise-addr=n1-cluster:26357
      --sql-addr=:26257 --advertise-sql-addr=node1:26257
      --http-addr=:8080
      --join=n1-cluster:26357,n2-cluster:26357,n3-cluster:26357
      --cache=256MiB --max-sql-memory=256MiB
      --external-io-dir=/backup
    volumes:
      - data1:/cockroach/cockroach-data
      - backup:/backup
    networks:
      client:
        gw_priority: 100
      cluster:
        aliases: [n1-cluster]
    ports:
      - "127.0.0.1:16201:26257"
      - "127.0.0.1:16204:8080"

  node2:
    <<: *node
    hostname: node2
    command: >
      start --insecure
      --listen-addr=:26357 --advertise-addr=n2-cluster:26357
      --sql-addr=:26257 --advertise-sql-addr=node2:26257
      --http-addr=:8080
      --join=n1-cluster:26357,n2-cluster:26357,n3-cluster:26357
      --cache=256MiB --max-sql-memory=256MiB
    volumes:
      - data2:/cockroach/cockroach-data
    networks:
      client:
        gw_priority: 100
      cluster:
        aliases: [n2-cluster]
    ports:
      - "127.0.0.1:16202:26257"
      - "127.0.0.1:16205:8080"

  node3:
    <<: *node
    hostname: node3
    command: >
      start --insecure
      --listen-addr=:26357 --advertise-addr=n3-cluster:26357
      --sql-addr=:26257 --advertise-sql-addr=node3:26257
      --http-addr=:8080
      --join=n1-cluster:26357,n2-cluster:26357,n3-cluster:26357
      --cache=256MiB --max-sql-memory=256MiB
    volumes:
      - data3:/cockroach/cockroach-data
    networks:
      client:
        gw_priority: 100
      cluster:
        aliases: [n3-cluster]
    ports:
      - "127.0.0.1:16203:26257"
      - "127.0.0.1:16206:8080"

  # S7 only: a fresh single node that restores node1's backup.
  restore:
    image: cockroachdb/cockroach:v26.3.2
    profiles: ["restore"]
    command: >
      start-single-node --insecure --http-addr=:8080
      --cache=256MiB --max-sql-memory=256MiB
      --external-io-dir=/backup
    volumes:
      - backup:/backup
    networks: [client]
    ports:
      - "127.0.0.1:16207:26257"

networks:
  client: {}
  cluster: {}

volumes:
  data1: {}
  data2: {}
  data3: {}
  backup: {}
