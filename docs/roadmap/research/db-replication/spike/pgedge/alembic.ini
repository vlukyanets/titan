[alembic]
script_location = %(here)s/migrations
# Overridden by the harness (or: alembic -x url=postgresql+psycopg://...).
sqlalchemy.url = postgresql+psycopg://postgres:spike@127.0.0.1:16001/titan

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
