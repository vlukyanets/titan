[project]
name = "titan"
version = "0.1.0"
description = "Self-hosted AI assistant, planner and tracker built on the Claude Agent SDK"
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20",
    "argon2-cffi>=25.1",
    "fastapi>=0.141",
    "pgvector>=0.5",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53",
]

[project.scripts]
titan = "titan.cli.main:main"
titan-api = "titan.api.server:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "import-linter>=2.15",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titan"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "N", "PT", "TID"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/titan/migrations/versions/*.py" = ["N999"]
"tests/**" = ["S104", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
exclude = ["spikes/"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: needs a PostgreSQL database (TITAN_TEST_DATABASE_URL)"]
addopts = "--strict-markers"

[tool.importlinter]
root_package = "titan"

[[tool.importlinter.contracts]]
name = "Domain logic does not import the API or the agent runtime"
type = "forbidden"
source_modules = ["titan.domains"]
forbidden_modules = ["titan.api", "titan.agent"]
