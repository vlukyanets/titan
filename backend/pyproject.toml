[project]
name = "titan"
version = "0.1.0"
description = "The TITAN node: the app that runs the chat and keeps the data"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.mypy]
strict = true
