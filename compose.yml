# Single-node TITAN for development and for the first node of a cluster.
# The API and ntfy are published only on TITAN_TAILSCALE_IP; there is deliberately no
# default, so the stack cannot start with a public listener by accident.
name: titan
services:
  db:
    # The same pgEdge image as the cluster (ADR 0006), without Spock subscriptions.
    image: ghcr.io/pgedge/pgedge-postgres:18.6-spock5.0.11-standard-3
    environment:
      POSTGRES_USER: titan
      POSTGRES_DB: titan
      POSTGRES_PASSWORD: ${TITAN_DB_PASSWORD:?set TITAN_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    # The pgEdge image listens only on localhost unless told otherwise.
    command: ["-c", "listen_addresses=*"]
    volumes:
      - db-data:/var/lib/pgsql
    healthcheck:
      # Over TCP, so the entrypoint's socket-only init server does not count as ready.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "titan", "-d", "titan"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: titan:dev
    build: .
    command: ["titan", "migrate"]
    environment: &app-env
      TITAN_DATABASE_URL: postgresql+psycopg://titan:${TITAN_DB_PASSWORD}@db:5432/titan
      # Semantic search (ADR 0014). An empty TITAN_EMBEDDINGS_URL turns it off.
      TITAN_EMBEDDINGS_URL: ${TITAN_EMBEDDINGS_URL-http://embeddings}
      TITAN_EMBEDDINGS_MODEL: ${TITAN_EMBEDDINGS_MODEL:-intfloat/multilingual-e5-base}
      TITAN_EMBEDDINGS_QUERY_PREFIX: "${TITAN_EMBEDDINGS_QUERY_PREFIX-query: }"
      TITAN_EMBEDDINGS_DOCUMENT_PREFIX: "${TITAN_EMBEDDINGS_DOCUMENT_PREFIX-passage: }"
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  api:
    image: titan:dev
    environment:
      <<: *app-env
      TITAN_BIND_HOST: 0.0.0.0
      TITAN_ALLOW_WILDCARD_BIND: "true"
      # Phones register endpoints on this ntfy; the API refuses any other push server.
      TITAN_PUSH_ALLOWED_ORIGINS: http://${TITAN_TAILSCALE_IP}:8080
      # Chat (docs/architecture/claude-auth.md). Only the selected mode's credential
      # reaches Claude Code; without it chat answers 503 and the rest works.
      TITAN_CLAUDE_AUTH_MODE: ${TITAN_CLAUDE_AUTH_MODE:-api-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    # Claude Code writes session transcripts into its config directory; keep them
    # in memory, since TITAN never resumes them (ADR 0009).
    tmpfs:
      - /app/.local/state/titan:uid=10001,gid=10001,mode=0700
    ports:
      - "${TITAN_TAILSCALE_IP:?set TITAN_TAILSCALE_IP to this node's Tailscale address, or 127.0.0.1 for local development}:8000:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  worker:
    # Same image, other entry point: the scheduler loop that fires reminders and
    # runs the daily plan. No ports: it talks to the database, the push server
    # and Claude.
    image: titan:dev
    command: ["titan-worker"]
    environment:
      <<: *app-env
      TITAN_PUSH_ALLOWED_ORIGINS: http://${TITAN_TAILSCALE_IP}:8080
      # Scheduled workflows (docs/architecture/claude-auth.md); without a working
      # credential they do not start, and reminders keep firing.
      TITAN_CLAUDE_AUTH_MODE: ${TITAN_CLAUDE_AUTH_MODE:-api-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Names this node in scheduler leases; the preferred node (the home server)
      # runs the sweeps while it is up. Both default to this node.
      TITAN_NODE_NAME: ${TITAN_NODE_NAME:-titan}
      TITAN_PREFERRED_NODE: ${TITAN_PREFERRED_NODE:-}
      TITAN_WORKER_HEARTBEAT_FILE: /tmp/titan-worker.alive
    tmpfs:
      - /app/.local/state/titan:uid=10001,gid=10001,mode=0700
    healthcheck:
      # Healthy while ticks succeed; a lost database makes the heartbeat go stale.
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/titan-worker.alive') > 60)"]
      interval: 15s
      timeout: 3s
      start_period: 20s
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  embeddings:
    # Local embedding model for semantic search (ADR 0014). Texts never leave the
    # node; the weights are downloaded once into the volume. No ports: only the
    # api and the worker call it, and they fall back to word search while it is
    # down or still loading.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    command:
      - --model-id=${TITAN_EMBEDDINGS_MODEL:-intfloat/multilingual-e5-base}
      - --revision=${TITAN_EMBEDDINGS_REVISION:-d128750597153bb5987e10b1c3493a34e5a4502a}
      - --auto-truncate
    volumes:
      - embeddings-models:/data
    restart: unless-stopped

  ntfy:
    # UnifiedPush server for the phones' ntfy app (ADR 0008). Messages carry only
    # notification ids, so its cache holds no user content.
    image: binwiederhier/ntfy:v2.28.0
    command: ["serve"]
    environment:
      NTFY_BASE_URL: http://${TITAN_TAILSCALE_IP}:8080
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_WEB_ROOT: disable
    volumes:
      - ntfy-cache:/var/cache/ntfy
    ports:
      - "${TITAN_TAILSCALE_IP}:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/v1/health | grep -q '\"healthy\":true'"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  db-data: {}
  embeddings-models: {}
  ntfy-cache: {}
